version: '3.8'

services:
  # ── Backend FastAPI Application ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/arjunavision.db
      - SECRET_KEY=e8a5b28d6c8f4a3e7b2d5a8c9e0f1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ML_SERVICE_URL=http://ml:8001
      - DEBUG=True
      - ENVIRONMENT=development
    volumes:
      - backend-data:/app
    depends_on:
      - ml

  # ── ML Inference Service ──────────────────────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    volumes:
      - ml-models:/app/models

  # ── Next.js Frontend App ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend-data:
  ml-models:
